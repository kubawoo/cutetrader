name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git commit hash

      - name: Install Qt6 and dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cached: true
          host: "linux"
          target: "desktop"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Run tests
        run: |
          ./build/test/testrunner/testrunner

      - name: Run tests with verbose output
        if: failure()
        run: |
          ./build/test/testrunner/testrunner -v2
